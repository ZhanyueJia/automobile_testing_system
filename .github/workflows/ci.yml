name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "fix/**"
      - "improve/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Minimal quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Compile Python sources
        run: python -m compileall -q common drivers tools test_cases conftest.py

      - name: Run critical Ruff checks
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Run CI smoke tests
        run: pytest -m smoke --env ci --test-rounds 3 -q
